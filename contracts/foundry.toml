[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "./deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "v4-core/=lib/v4-periphery/lib/v4-core/src/",
  "v4-periphery/=lib/v4-periphery/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "@openzeppelin/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/",
]

[rpc_endpoints]
unichain_sepolia = "https://sepolia.unichain.org"

[fuzz]
runs = 512

[lint]
lint_on_build = false
